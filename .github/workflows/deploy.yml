name: Deploy Astro site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live site
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="${{ vars.MONITOR_URL }}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL="${{ vars.SITE_URL }}"
          fi
          if [ -z "$SITE_URL" ]; then
            SITE_URL="http://jjchwordpress.cloud"
          fi

          echo "Checking: ${SITE_URL}/"
          for i in {1..12}; do
            if curl -fsSIL --max-time 20 "${SITE_URL}/" >/dev/null; then
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "Homepage check failed after retries"
              exit 1
            fi
            sleep 10
          done

          echo "Checking: ${SITE_URL}/sitemap.xml"
          curl -fsSIL --max-time 20 "${SITE_URL}/sitemap.xml" >/dev/null
